name: Build and deploy

# Every push to main publishes both build targets. `workflow_dispatch` allows a
# re-deploy of the current commit without pushing a no-op commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued rather than cancelled, so a release is never
# left half-applied to the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Hard gate. `npm run lint` and `npm run type-check` both pass, so this can
  # block a release: it catches a bad push before it reaches either host.
  #
  # The pre-existing debt that used to fail here is fixed — unused vars in
  # RegisterPage/UsersPage/FormStatistics, the undeclared `usersApi` import in
  # ProfilePage, and TS7016 across the untyped `src/api` + `src/utiles` .js layer
  # (now declared in src/types/api.ts and the matching *.d.ts files). The API
  # layer's *bodies* are still `any`; see src/types/api.ts for the migration note.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  # ---- GitHub Pages project site: base "/ysr-system-front/" ----
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails here rather than at the end of the run if Pages was never
      # enabled for this repository (Settings -> Pages -> Source: GitHub Actions).
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Vite inlines VITE_* at build time, so these are injected here rather
      # than read at runtime by the deployed site.
      #
      # This workflow produces the PROJECT-SITE build, so the base is pinned to
      # the sub-path. Because a real env var outranks the committed
      # .env.production, that file can keep VITE_BASE_PATH="/" (the
      # panel.rohanian-ysr.ir build) without affecting this deploy.
      #
      # Overridable with repository variables (Settings -> Secrets and variables
      # -> Actions -> Variables) without editing this file:
      #   VITE_API_BASE_URL      "https://api.rohanian-ysr.ir"   backend origin
      #   VITE_GOOGLE_CLIENT_ID  "<id>.apps.googleusercontent.com"
      - name: Build
        env:
          VITE_BASE_PATH: /ysr-system-front/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.rohanian-ysr.ir' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build:pages

      # Belt-and-braces: the build already self-verifies via a Vite plugin, but
      # re-asserting the expected base here means this job fails even if that
      # plugin is ever removed or reordered.
      - name: Verify the artifact is built for the project-site sub-path
        run: npm run verify:dist-pages

      # Do NOT set CUSTOM_DOMAIN. panel.rohanian-ysr.ir is served by Arvancdn, not
      # by Pages, and its DNS does not point at GitHub. Emitting a CNAME would
      # make GitHub try to serve a domain it does not control, which breaks this
      # project site. The domain gets its own build — see the `build-domain` job.
      - name: Write CNAME
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist-pages/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  # ---- Arvancdn custom domain: base "/" ----
  #
  # The domain is hosted by Arvancdn, whose DNS does not point at GitHub, so the
  # Pages artifact can never be published there — it is built for the sub-path and
  # would 404 on every asset. This job produces the correct artifact on every push
  # and attaches it to the run, so the bundle that reaches Arvancdn is always the
  # one built for it.
  #
  # The publish step is opt-in. Until ARVAN_DEPLOY_ENABLED is set to "true" the
  # artifact is produced and downloadable but nothing is uploaded, so merging this
  # change cannot unexpectedly overwrite the live site.
  build-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Stated explicitly rather than inherited from .env.production, so this
          # job does not depend on a committed file staying correct.
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.rohanian-ysr.ir' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Verify the artifact is built for the domain root
        run: npm run verify:dist

      # Attached to the run either way, so the correct bundle is always available
      # even when the upload below is not configured.
      - name: Archive the custom-domain bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-domain
          path: dist/
          retention-days: 30

      # Opt-in publish. To enable, set repository variable ARVAN_DEPLOY_ENABLED=true
      # and secrets ARVAN_HOST / ARVAN_USER / ARVAN_PASSWORD (Settings -> Secrets
      # and variables -> Actions).
      #
      # `mirror --delete` is deliberate: leftover hashed files from a previous
      # release are dead weight, and keeping the directory exactly equal to the
      # artifact means what is live is precisely what CI verified. `-R` is lftp's
      # reverse mode (local -> remote).
      #
      # ARVAN_HOST is the host[:port] only, with no scheme and no trailing path.
      # If the account is FTPS-only, change `ftp:ssl-allow no` to
      # `ftp:ssl-force yes` below.
      - name: Publish to Arvancdn
        if: ${{ vars.ARVAN_DEPLOY_ENABLED == 'true' }}
        env:
          ARVAN_HOST: ${{ secrets.ARVAN_HOST }}
          ARVAN_USER: ${{ secrets.ARVAN_USER }}
          ARVAN_PASSWORD: ${{ secrets.ARVAN_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set net:timeout 15;
            open -u \"$ARVAN_USER\",\"$ARVAN_PASSWORD\" \"$ARVAN_HOST\";
            mirror -R --delete --verbose dist/ .;
            bye;
          "

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
