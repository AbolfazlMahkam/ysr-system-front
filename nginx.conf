server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- gzip ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff font/woff2;

    # ---- lightweight healthcheck endpoint (used by compose) ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- Uploaded files are referenced as ROOT-RELATIVE /uploads/... in the UI,
    #      so the browser resolves them against the FRONTEND origin. Proxy them to
    #      the backend, otherwise every uploaded-file link 404s or 502s.
    #
    #      Using the PUBLIC backend URL because the Docker-internal `backend`
    #      hostname may not resolve in your setup. The backend IS reachable at
    #      api.rohanian-ysr.ir (confirmed working). The Host header is set to
    #      the upstream host so the host-level reverse proxy routes correctly.
    #      If you switch back to Docker Compose internal networking, use:
    #        resolver 127.0.0.11 valid=30s ipv6=off;
    #        set $upstream http://backend:3000;
    #        proxy_pass $upstream;
    location /uploads/ {
        proxy_pass              https://api.rohanian-ysr.ir;
        proxy_http_version      1.1;
        proxy_set_header        Host              api.rohanian-ysr.ir;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_ssl_verify        off;
    }

    # ---- long-cache hashed Vite assets ----
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ---- index.html must never be cached, or clients pin a stale bundle hash ----
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---- SPA fallback: every unknown path -> index.html (react-router v7) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
